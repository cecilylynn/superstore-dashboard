<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>

    <!-- Plotly.js for client-side chart rendering -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<div class="page">

    <!-- ═══════════════════════════════════════════════════════════════════
         SIDEBAR — filter controls
         ═══════════════════════════════════════════════════════════════════ -->
    <div class="sidebar">
        <h3>Settings</h3>

        <!-- Year selector -->
        <label for="sel-year">Year</label>
        <select id="sel-year" onchange="update()">
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023" selected>2023</option>
        </select>

        <!-- Month selector -->
        <label for="sel-month">Through Month</label>
        <select id="sel-month" onchange="update()">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12" selected>December</option>
        </select>

        <hr>

        <!-- Time Range toggle -->
        <div class="radio-group">
            <div class="radio-group-title">Time Range</div>
            <label>
                <input type="radio" name="time_range" value="YTD" checked onchange="update()">
                Year-to-Date
            </label>
            <label>
                <input type="radio" name="time_range" value="Month Only" onchange="update()">
                Month Only
            </label>
        </div>

        <hr>

        <!-- Comparison Mode toggle -->
        <div class="radio-group">
            <div class="radio-group-title">Compare To</div>
            <label>
                <input type="radio" name="comp_mode" value="vs Goal" checked onchange="update()">
                vs Goal
            </label>
            <label>
                <input type="radio" name="comp_mode" value="vs Prior Year" onchange="update()">
                vs Prior Year
            </label>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════
         MAIN CONTENT
         ═══════════════════════════════════════════════════════════════════ -->
    <div class="main">

        <!-- Header bar -->
        <div class="dashboard-header">
            <div class="dashboard-title">Sales Dashboard</div>
            <div class="dashboard-subtitle" id="period-label"></div>
        </div>

        <!-- Navigation bar (shown only in drill-down mode) -->
        <div class="nav-bar" id="nav-bar" style="display: none;">
            <a href="#" class="back-btn" onclick="goBack(); return false;">
                &larr; Back to Overview
            </a>
            <span class="nav-label" id="nav-label"></span>
        </div>

        <!-- ROW 1: KPI card (left) + main chart (right) -->
        <div class="row">
            <div style="flex: 0 0 280px;">
                <div class="card kpi" id="kpi-main"></div>
            </div>
            <div style="flex: 1; min-width: 0;">
                <div class="card">
                    <div class="chart-label" id="chart-main-label"></div>
                    <div class="chart-card-inner">
                        <div id="chart-main" class="chart-container" style="height: 320px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 2: Three category panels (overview) or detail (drill-down) -->
        <div id="row2"></div>

    </div>
</div>

<!-- Our custom JavaScript -->
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
